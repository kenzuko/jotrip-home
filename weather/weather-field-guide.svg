<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" role="img" aria-labelledby="t d">
<title id="t">Cách đọc các chỉ số thời tiết Phú Quốc</title><desc id="d">Sáu sơ đồ giải thích mưa, gió và gió giật, sóng, mây đối lưu, bụi mịn PM2.5 và thủy triều.</desc>
<rect width="1120" height="820" rx="30" fill="#f2f8f6"/><text x="48" y="58" fill="#123f3b" font-family="Arial,sans-serif" font-size="28" font-weight="700">ĐỌC NHANH THỜI TIẾT & BIỂN</text><text x="48" y="88" fill="#56736d" font-family="Arial,sans-serif" font-size="16">Các con số mô tả những khía cạnh khác nhau — hãy xem cùng thời điểm và đúng khu vực.</text>
<g font-family="Arial,sans-serif">
<g transform="translate(32 116)"><rect width="516" height="198" rx="22" fill="#fff"/><circle cx="60" cy="58" r="31" fill="#d9f0fa"/><path d="M60 34c-7 13-16 22-16 32a16 16 0 0 0 32 0c0-10-9-19-16-32" fill="#1498c6"/><text x="108" y="52" font-size="21" font-weight="700" fill="#163f4e">MƯA</text><text x="108" y="78" font-size="14" fill="#456571">mm/h = cường độ tại thời điểm đó</text><rect x="38" y="113" width="50" height="34" rx="8" fill="#d8eff8"/><rect x="99" y="93" width="50" height="54" rx="8" fill="#9bd8eb"/><rect x="160" y="67" width="50" height="80" rx="8" fill="#45aeca"/><path d="M239 130c35-35 64-8 95-30s47-30 83-9" fill="none" stroke="#ed9a46" stroke-width="4"/><text x="38" y="171" font-size="13" fill="#456571">Xác suất (%) cho biết khả năng mưa; không phải lượng mưa.</text></g>
<g transform="translate(572 116)"><rect width="516" height="198" rx="22" fill="#fff"/><circle cx="60" cy="58" r="31" fill="#e7f2df"/><path d="M35 54h47M41 43h32M41 65h32" stroke="#4d9c58" stroke-width="4" stroke-linecap="round"/><text x="108" y="52" font-size="21" font-weight="700" fill="#284d37">GIÓ & GIÓ GIẬT</text><text x="108" y="78" font-size="14" fill="#456571">Gió duy trì là nền; gió giật là đỉnh ngắn</text><path d="M42 139h428M52 119l80-16 65 22 77-50 80 38 90-56" fill="none" stroke="#55a878" stroke-width="4"/><path d="M52 148V90M132 148V77M212 148V67M292 148V59M372 148V67M452 148V48" stroke="#bdddc7" stroke-width="2"/><text x="38" y="174" font-size="13" fill="#456571">Khi đi biển, chú ý gió giật và xu hướng tăng.</text></g>
<g transform="translate(32 334)"><rect width="516" height="198" rx="22" fill="#fff"/><circle cx="60" cy="58" r="31" fill="#d9eafa"/><path d="M31 62q14-14 28 0t28 0M31 74q14-14 28 0t28 0" fill="none" stroke="#347dbb" stroke-width="4"/><text x="108" y="52" font-size="21" font-weight="700" fill="#21486a">SÓNG</text><text x="108" y="78" font-size="14" fill="#456571">Hs = chiều cao sóng có ý nghĩa; Hmax cao hơn</text><path d="M40 145q38-47 76 0t76 0t76 0t76 0t76 0" fill="none" stroke="#4a9bcc" stroke-width="4"/><path d="M40 154H454" stroke="#aacde2" stroke-width="2"/><text x="38" y="177" font-size="13" fill="#456571">Chu kỳ càng dài, sóng thường truyền năng lượng mạnh hơn.</text></g>
<g transform="translate(572 334)"><rect width="516" height="198" rx="22" fill="#fff"/><circle cx="60" cy="58" r="31" fill="#eee7fb"/><path d="M37 64q-9-17 7-23 8-18 26-7 20-5 21 16 13 16-5 23H47q-10 0-10-9" fill="#8774cb"/><text x="108" y="52" font-size="21" font-weight="700" fill="#4b4077">MÂY ĐỐI LƯU</text><text x="108" y="78" font-size="14" fill="#456571">Mây phát triển nhanh có thể đi kèm dông</text><path d="M70 113v40m-10-13 10 13 10-13" fill="none" stroke="#8774cb" stroke-width="4"/><path d="M155 142q24-29 48 0t48 0" fill="none" stroke="#b9aee4" stroke-width="4"/><text x="38" y="177" font-size="13" fill="#456571">Ảnh vệ tinh cho hình dạng mây, không tự xác nhận mưa tại điểm.</text></g>
<g transform="translate(32 552)"><rect width="516" height="198" rx="22" fill="#fff"/><circle cx="60" cy="58" r="31" fill="#fce9d8"/><path d="M41 72c9-14 9-27 0-37m19 37c9-14 9-27 0-37m19 37c9-14 9-27 0-37" fill="none" stroke="#dd7a3d" stroke-width="4"/><text x="108" y="52" font-size="21" font-weight="700" fill="#704322">AQI & PM2.5</text><text x="108" y="78" font-size="14" fill="#456571">PM2.5 là hạt bụi mịn; AQI quy đổi mức tác động</text><rect x="42" y="120" width="80" height="20" rx="10" fill="#60b986"/><rect x="122" y="120" width="80" height="20" fill="#f1cc51"/><rect x="202" y="120" width="80" height="20" fill="#e99850"/><rect x="282" y="120" width="80" height="20" rx="0" fill="#d66b65"/><text x="38" y="170" font-size="13" fill="#456571">AQI càng cao, nhóm nhạy cảm càng nên hạn chế gắng sức ngoài trời.</text></g>
<g transform="translate(572 552)"><rect width="516" height="198" rx="22" fill="#fff"/><circle cx="60" cy="58" r="31" fill="#dff3ee"/><path d="M31 66q14-15 28 0t28 0M31 75q14-15 28 0t28 0" fill="none" stroke="#259a8b" stroke-width="4"/><text x="108" y="52" font-size="21" font-weight="700" fill="#235c54">TRIỀU</text><text x="108" y="78" font-size="14" fill="#456571">Mực nước đổi theo chu kỳ; dòng chảy có thể lệch pha</text><path d="M41 143c46-71 83-71 126 0s83 71 129 0" fill="none" stroke="#309f95" stroke-width="4"/><circle cx="125" cy="92" r="5" fill="#147d78"/><circle cx="215" cy="163" r="5" fill="#147d78"/><text x="38" y="177" font-size="13" fill="#456571">Dùng cùng dự báo sóng, gió và khu vực trước khi ra biển.</text></g>
</g><text x="48" y="790" font-family="Arial,sans-serif" font-size="13" fill="#668078">Quan trắc, mô hình và ước tính có độ chắc chắn khác nhau; xem nhãn thời điểm/cập nhật trên từng thẻ.</text></svg>