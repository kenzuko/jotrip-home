name: OpenPQ Traffic Live Smoke
on:
  pull_request:
    paths:
      - 'scripts/test-live-traffic.mjs'
      - '.github/workflows/openpq-traffic-live-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 0 * * *'
permissions:
  contents: read
jobs:
  live-traffic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed website traffic and privacy
        run: node scripts/test-live-traffic.mjs
