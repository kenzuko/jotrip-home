name: Diagnostic - Check CMS Production Commit Once

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare Pages production deployment
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.parse
          token=os.environ["CF_API_TOKEN"].strip()
          def get(url):
              req=urllib.request.Request(url,headers={
                  "Authorization":"Bearer "+token,
                  "Content-Type":"application/json",
                  "User-Agent":"OpenPQ-Deploy-Diagnostic/1.0",
              })
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.loads(r.read().decode())
          accounts=get("https://api.cloudflare.com/client/v4/accounts").get("result") or []
          aid=accounts[0]["id"]
          url=f"https://api.cloudflare.com/client/v4/accounts/{aid}/pages/projects/jotrip-home/deployments"
          rows=get(url).get("result") or []
          prod=[x for x in rows if x.get("environment")=="production"]
          print("production_count=",len(prod))
          for x in prod[:3]:
              trig=x.get("deployment_trigger") or {}
              meta=(trig.get("metadata") or {})
              print("deployment:",x.get("id"),"stage=",((x.get("latest_stage") or {}).get("status")),"branch=",meta.get("branch"),"commit_hash=",meta.get("commit_hash"),"created_on=",x.get("created_on"),"url=",x.get("url"))
          PY
