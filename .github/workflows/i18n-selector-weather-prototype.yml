name: i18n selector Weather prototype tests

on:
  pull_request:
    paths:
      - "core/language-switcher.js"
      - "core/language-switcher.css"
      - "core/weather-freshness-policy.mjs"
      - "core/en-dynamic-islands-prototype.mjs"
      - "scripts/inject-static-language-switcher.mjs"
      - "scripts/test-i18n-selector-weather-prototype.mjs"
      - "scripts/visual-qa-i18n-selector-prototype.mjs"
      - "scripts/build-cloudflare.mjs"
      - ".github/workflows/i18n-selector-weather-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run isolated contract tests
        run: node scripts/test-i18n-selector-weather-prototype.mjs
      - name: Prove routing and production Worker entrypoints are untouched
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if ! git diff --quiet "origin/${{ github.base_ref }}"...HEAD -- worker.js wrangler.jsonc scripts/routes.json functions/_middleware.js .github/workflows/cloudflare-worker.yml; then
            echo "::error::Prototype changed production routing or Worker deployment configuration"
            git diff "origin/${{ github.base_ref }}"...HEAD -- worker.js wrangler.jsonc scripts/routes.json functions/_middleware.js .github/workflows/cloudflare-worker.yml
            exit 1
          fi
          echo "PASS: no production routing/deploy config changes"
      - name: Install browser QA only
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Build production-like static bundle
        run: node scripts/build-cloudflare.mjs
      - name: Start isolated static server
        shell: bash
        run: |
          python3 -m http.server 4188 --bind 127.0.0.1 --directory dist >/tmp/openpq-prototype-server.log 2>&1 &
          echo $! >/tmp/openpq-prototype-server.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:4188/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/openpq-prototype-server.log
          exit 1
      - name: Browser safety and layout gate
        env:
          VISUAL_QA_BASE_URL: http://127.0.0.1:4188
        run: node scripts/visual-qa-i18n-selector-prototype.mjs
