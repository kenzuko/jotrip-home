name: OpenPQ Brand Favicon Live Smoke
on:
  pull_request:
    paths:
      - 'scripts/test-live-brand-favicon.mjs'
      - '.github/workflows/openpq-brand-favicon-live-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: '13 1 * * *'
permissions:
  contents: read
jobs:
  favicon-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live official Open Phu Quoc favicon
        run: node scripts/test-live-brand-favicon.mjs
