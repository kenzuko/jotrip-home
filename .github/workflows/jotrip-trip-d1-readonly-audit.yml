name: JoTrip Trip D1 read-only audit

on:
  push:
    branches:
      - audit/jotrip-trip-d1-readonly-20260926
    paths:
      - ".github/workflows/jotrip-trip-d1-readonly-audit.yml"

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'kenzuko/jotrip-home' && github.ref == 'refs/heads/audit/jotrip-trip-d1-readonly-20260926'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_TRIP_D1_ID: "17372bb5-7626-4238-8a95-fc0cf31ad18e"
    steps:
      - name: Confirm existing Cloudflare access (never print secrets)
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::No existing Cloudflare Actions credentials in this repository. No remote request made."
            exit 2
          fi
          echo "Existing Cloudflare Actions credentials detected."
      - uses: actions/checkout@v4
        with:
          repository: kenzuko/jotrip-trip
          ref: 4399895a049cf03c919727d5b2bfaacf5885117f
          path: trip-audit
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read-only remote D1 identity, schema and migration preflight
        shell: bash
        run: |
          set -euo pipefail
          # Some existing repository secrets contain an accidental trailing newline.
          # Normalize whitespace and wrapping quotes without printing the value.
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]' | sed -e 's/^"//' -e 's/"$//')"
          export CLOUDFLARE_ACCOUNT_ID
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-zA-Z0-9_-]{32}$ ]]; then
            echo "::error::Configured Cloudflare account ID is malformed after normalization; stopping."
            exit 4
          fi
          mkdir -p /tmp/jotrip-trip-d1-audit
          cd /tmp/jotrip-trip-d1-audit
          trap 'rm -f /tmp/jotrip-trip-d1-audit/schema.sql /tmp/jotrip-trip-d1-audit/info.json /tmp/jotrip-trip-d1-audit/tables.json /tmp/jotrip-trip-d1-audit/presence.json /tmp/jotrip-trip-d1-audit/databases.json /tmp/jotrip-d1-export.log' EXIT
          cat > wrangler.toml <<'CONFIG'
          name = "jotrip-trip-d1-audit"
          compatibility_date = "2026-09-26"
          [[d1_databases]]
          binding = "DB"
          database_name = "jotrip-trip-db"
          database_id = "17372bb5-7626-4238-8a95-fc0cf31ad18e"
          migrations_dir = "migrations"
          CONFIG
          npx --yes wrangler@4 d1 info jotrip-trip-db --json > info.json
          if ! grep -Fq "$EXPECTED_TRIP_D1_ID" info.json; then
            echo "::error::Cloudflare account does not expose the reviewed trip D1 UUID. Stopping."
            exit 3
          fi
          echo "Confirmed remote D1 UUID matches the JoTrip Trip configuration."
          # Suppress Wrangler's temporary signed export URL in public CI logs.
          if ! npx --yes wrangler@4 d1 export jotrip-trip-db --remote --no-data --output=./schema.sql > /tmp/jotrip-d1-export.log 2>&1; then
            echo "::error::Schema-only export failed; sensitive export URL not logged."
            exit 5
          fi
          echo "Schema-only export completed; CREATE TABLE count: $(grep -Eic 'CREATE[[:space:]]+TABLE' schema.sql || true)"
          node "$GITHUB_WORKSPACE/trip-audit/tools/d1-schema-preflight.mjs" ./schema.sql
          echo "Live sqlite_master table names (read-only):"
          npx --yes wrangler@4 d1 execute jotrip-trip-db --remote --command="SELECT name FROM sqlite_master WHERE type='table' ORDER BY name" --json > ./tables.json
          node -e 'const a=JSON.parse(require("fs").readFileSync("tables.json","utf8")); console.log(JSON.stringify((Array.isArray(a)?a[0]?.results:a.results||[]).map(x=>x.name)))'
          echo "Legacy data presence (boolean only, no customer records or exact counts):"
          npx --yes wrangler@4 d1 execute jotrip-trip-db --remote --command="SELECT (SELECT COUNT(*) FROM trips) AS trips, (SELECT COUNT(*) FROM chat_sessions) AS chat_sessions, (SELECT COUNT(*) FROM chat_messages) AS chat_messages, (SELECT COUNT(*) FROM hotels_public) AS hotels_public" --json > ./presence.json
          node -e 'const a=JSON.parse(require("fs").readFileSync("presence.json","utf8")); const r=(Array.isArray(a)?a[0]?.results:a.results||[])[0]||{}; console.log(JSON.stringify(Object.fromEntries(Object.entries(r).map(([k,v])=>[k,Number(v)>0]))))'
          echo "Existing JoTrip Trip databases (names only):"
          npx --yes wrangler@4 d1 list --json > ./databases.json
          node -e 'const a=JSON.parse(require("fs").readFileSync("databases.json","utf8")); console.log(JSON.stringify((Array.isArray(a)?a:a.result||[]).map(x=>x.name).filter(x=>/^jotrip-trip/i.test(x))))'
          cp -r "$GITHUB_WORKSPACE/trip-audit/migrations" ./migrations
          echo "Remote migration history (read-only):"
          if ! npx --yes wrangler@4 d1 migrations list jotrip-trip-db --remote; then
            echo "::warning::Migration history could not be reconciled automatically; review before any migration."
          fi
          echo "No remote database mutation, backup, deploy or DNS change performed."
