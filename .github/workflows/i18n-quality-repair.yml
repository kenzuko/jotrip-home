name: Validate translation quality

on:
  push:
    branches:
      - main
    paths:
      - "data/i18n/**"
      - "cms/translation-lifecycle.json"
      - "cms/translation-pipeline.json"
      - "scripts/i18n-*.mjs"
      - "scripts/test-i18n-*.mjs"
      - ".github/workflows/i18n-quality-repair.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openpq-i18n-quality-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate locale lifecycle, glossary and editorial guards
        run: npm run i18n:check
