name: Publish OpenPQ CMS Pages

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cms-pages-publish.yml"
      - "scripts/build-cloudflare.mjs"
      - "scripts/build-knowledge-public.mjs"
      - "data/knowledge/**"
      - "data/visual-context.json"
      - "data/content.json"
      - "ecosystem-shell.css"
      - "explore/**"
      - "utilities/**"
      - "currency/**"
      - "scripts/test-home-food-random.mjs"
      - "scripts/test-food-id-mapping.mjs"
      - "data/food.json"
      - "data/i18n/**/food.json"
      - "food/**"
      - "guide/**"
      - "index.html"
      - "styles.css"
      - "home-foundation-v2.js"
      - "home-nearme-v2.js"
      - "scripts/test-home-nearme.mjs"
      - "home-experience-v1.js"
      - "home-live-v3.js"
      - "data/views/today-rules.json"
      - "core/trip-clock-planner.js"
      - "data/home-support.json"
      - "data/operational-notices.json"
      - "places/detail.js"
      - "data/entities/**"
      - "transit/**"
      - "scripts/test-transit-mobile-ui.mjs"
      - "scripts/test-trip-clock-planner.mjs"
      - "scripts/validate-home-knowledge.mjs"
      - "admin/**"
      - "functions/**"
      - "migrations/d1/**"
      - "wrangler.pages.jsonc"
  # The dedicated CMS Weather Standalone workflow owns the 20-minute refresh.
  # Avoid racing two independent deployments of the same CMS Pages project.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openpq-cms-pages
  cancel-in-progress: false

jobs:
  cms-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CMS weather collectors
        run: python -m pip install --quiet boto3 s3fs xarray h5netcdf h5py numpy pyproj

      - name: Build and validate CMS
        id: build
        run: |
          node scripts/build-map-coverage.mjs
          node scripts/build-location-index.mjs
          node scripts/weather-cms-sync.mjs --strict
          node scripts/weather-cms-smoke.mjs
          node scripts/build-cloudflare.mjs
          node scripts/validate-cms-publication.mjs
          node scripts/test-cms-access.mjs
          node scripts/test-nearme-venues.mjs
          node scripts/validate-home-support.mjs
          node scripts/test-trip-clock-planner.mjs
          node scripts/test-home-nearme.mjs
          node --check home-nearme-v2.js
          node scripts/test-transit-mobile-ui.mjs
          node scripts/test-home-food-random.mjs
          node scripts/test-food-id-mapping.mjs
          node --check utilities/utilities.js
          node --check currency/currency.js
          node --check food/food.js
          node --check stories/story.js
          node --check transit/app.js
          node --check core/trip-clock-planner.js
          node --check home-foundation-v2.js
          mkdir -p dist/data/meta
          printf '{"source_commit":"%s"}\n' "$GITHUB_SHA" > dist/data/meta/cms-build.json
          node scripts/validate-knowledge.mjs
          node scripts/validate-data.mjs
          node scripts/validate-home-knowledge.mjs
          node scripts/test-search.mjs
          node scripts/validate-public-copy.mjs
          echo "public_count=$(node scripts/validate-cms-publication.mjs --count)" >> "$GITHUB_OUTPUT"
          test -f dist/guide/knowledge.html
          test -f dist/guide/article.html
          test -f dist/admin/index.html
          test ! -e dist/data/knowledge/objects.json

      - name: Find exact CMS Pages project
        id: discover
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node <<'NODE'
          const fs=require("node:fs");
          const CF_TOKEN=(process.env.CF_TOKEN||"").trim(),CF_ACCOUNT=(process.env.CF_ACCOUNT||"").trim();
          const output=(k,v)=>fs.appendFileSync(process.env.GITHUB_OUTPUT,k+"="+v+"\n");
          if(!CF_TOKEN||!CF_ACCOUNT){console.log("Cloudflare credentials unavailable.");output("ready","false");process.exit(0);}
          (async()=>{
            const r=await fetch("https://api.cloudflare.com/client/v4/accounts/"+encodeURIComponent(CF_ACCOUNT)+"/pages/projects",{headers:{Authorization:"Bearer "+CF_TOKEN}});
            if(!r.ok){const j=await r.json().catch(()=>({}));console.log("Pages inventory HTTP",r.status,(j.errors||[]).map(e=>e.code+":"+e.message).join(";").slice(0,350));output("ready","false");return;}
            const x=await r.json();const projects=x.result||[];
            console.log("Accessible Pages projects:",projects.length);
            const matches=projects.filter(p=>(p.domains||[]).some(d=>String(d).toLowerCase()==="cms.openphuquoc.com"));
            if(matches.length!==1){
              console.log("Exact CMS domain matches:",matches.length);
              console.log("CMS-like project names:",projects.filter(p=>/cms|openpq|openphuquoc/i.test(p.name)).map(p=>p.name).join(", ")||"none");
              output("ready","false");return;
            }
            const p=matches[0],cfg=p.source?.config||{},owner=String(cfg.owner||"").toLowerCase(),repo=String(cfg.repo_name||"").toLowerCase();
            if(repo&&(repo!=="jotrip-home"||(owner&&owner!=="kenzuko"))){console.log("CMS source repo differs; no deployment.");output("ready","false");return;}
            if(!/^[a-z0-9][a-z0-9_-]{0,63}$/.test(p.name)){output("ready","false");return;}
            console.log("Matched CMS project:",p.name,"production branch:",p.production_branch);
            output("ready","true");output("project",p.name);
          })().catch(e=>{console.log("CMS discovery failed:",e.message);output("ready","false");});
          NODE

      - name: Deploy verified CMS Pages
        id: deploy
        if: steps.discover.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ steps.discover.outputs.project }}
        run: |
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          npx --yes wrangler@4.136.3 d1 migrations apply openpq-cms --remote --config=wrangler.pages.jsonc
          # Pages rejects --config when it points to a non-default path. Run
          # from an isolated directory with the Pages config under Wrangler's default filename.
          mkdir -p "$RUNNER_TEMP/cms-pages"
          cp wrangler.pages.jsonc "$RUNNER_TEMP/cms-pages/wrangler.jsonc"
          # Wrangler finds Pages Functions relative to its working directory.
          # Copy the real CMS API/Weather edge functions into this isolated directory.
          cp -a "$GITHUB_WORKSPACE/functions" "$RUNNER_TEMP/cms-pages/functions"
          # Shared Weather validation modules are imported from the repository root.
          # Stage them beside functions so Wrangler can bundle CMS Pages correctly.
          mkdir -p "$RUNNER_TEMP/cms-pages/weather"
          cp "$GITHUB_WORKSPACE/weather/weather-wind-guard.js" "$RUNNER_TEMP/cms-pages/weather/"
          cp "$GITHUB_WORKSPACE/weather/weather-gust-outlook.js" "$RUNNER_TEMP/cms-pages/weather/"
          test -f "$RUNNER_TEMP/cms-pages/functions/weather/data/[[path]].js"
          test -s "$RUNNER_TEMP/cms-pages/weather/weather-wind-guard.js"
          test -s "$RUNNER_TEMP/cms-pages/weather/weather-gust-outlook.js"
          cd "$RUNNER_TEMP/cms-pages"
          npx --yes wrangler@4.136.3 pages deploy "$GITHUB_WORKSPACE/dist" --project-name="$PROJECT_NAME" --branch=main

      - name: Verify CMS commit, library, Weather and admin after CDN propagation
        if: steps.deploy.outcome == 'success'
        env:
          EXPECTED_PUBLIC_COUNT: ${{ steps.build.outputs.public_count }}
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from "node:fs/promises";
          const expected=process.env.GITHUB_SHA;
          const expectedCount=Number(process.env.EXPECTED_PUBLIC_COUNT);
          const root="https://cms.openphuquoc.com";
          const expectedAdmin=(await readFile("dist/admin/index.html","utf8"))
            .match(/admin\.js\?v=[0-9]+/)?.[0];
          const builtHomepage=await readFile("dist/index.html","utf8");
          const expectedPlanner=builtHomepage.match(/core\/trip-clock-planner\.js\?v=[a-zA-Z0-9-]+/)?.[0];
          const expectedHome=builtHomepage.match(/home-foundation-v2\.js\?v=[a-zA-Z0-9-]+/)?.[0];
          if(!expectedAdmin||!expectedPlanner||!expectedHome||!Number.isInteger(expectedCount))
            throw Error("Build verification lacks expected CMS metadata");
          const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          // A successful Pages upload may reach its *.pages.dev preview before
          // the custom-domain edge. An immediate custom-domain GET can return
          // the old SPA fallback HTML instead of the new JSON build marker.
          async function verify(attempt){
            const nonce=encodeURIComponent(expected+"-"+attempt);
            const get=async(path)=>{
              const r=await fetch(root+path+(path.includes("?")?"&":"?")+"v="+nonce,{
                headers:{"Cache-Control":"no-cache"},signal:AbortSignal.timeout(15000)
              });
              const body=await r.text();
              if(!r.ok)throw Error(path+" HTTP "+r.status);
              return {body,type:r.headers.get("content-type")||""};
            };
            const marker=await get("/data/meta/cms-build.json");
            if(!marker.type.includes("json"))throw Error("CMS build marker still routed to "+marker.type);
            const build=JSON.parse(marker.body);
            if(build.source_commit!==expected)throw Error("CMS live SHA "+
              String(build.source_commit||"missing")+" != expected "+expected);
            // Prove the deployed CMS hostname runs the live Pages Function,
            // not just a static Weather snapshot from the latest build.
            const edge=await get("/weather/data/edge-health.json");
            const edgeHealth=JSON.parse(edge.body);
            if(edgeHealth.schema_version!=="openpq-weather-edge-health-v1"||
               edgeHealth.cloudflare_edge!==true||
               !Array.isArray(edgeHealth.results)||
               !Number.isFinite(Date.parse(edgeHealth.checked_at))||
               Date.now()-Date.parse(edgeHealth.checked_at)>120000)
              throw Error("CMS live Weather Pages Function missing or unhealthy");
            const homepage=await get("/");
            if(!homepage.body.includes(expectedPlanner)||!homepage.body.includes(expectedHome))
              throw Error("CMS homepage scripts differ from the current built version");
            const planner=await get("/core/trip-clock-planner.js");
            if(!planner.body.includes("OpenPQTripClockPlanner")||!planner.body.includes("function plan("))
              throw Error("CMS trip-clock planner asset not deployed");
            const library=await get("/data/views/knowledge-public.json");
            const data=JSON.parse(library.body);
            if(data.count!==expectedCount||data.objects?.length!==expectedCount)
              throw Error("CMS article inventory mismatch, count="+data.count);
            const guide=await get("/guide/knowledge.html");
            if(!guide.body.includes('data-knowledge-page="library"'))
              throw Error("Knowledge library page missing");
            const admin=await get("/admin/");
            if(!admin.body.includes(expectedAdmin))throw Error("CMS admin JS build mismatch");
            const weather=await get("/weather/");
            if(!weather.body.includes("/weather/weather-v2.js")||
               !weather.body.includes("/weather/weather-wind-guard.js?v=20260924-qc1"))
              throw Error("CMS Weather page does not load shared wind-source guard");
            const guard=await get("/weather/weather-wind-guard.js");
            if(!guard.body.includes("JoTripWindGuard")||
               !guard.body.includes("2026.09.24.wind-qc-v1"))
              throw Error("CMS Weather guard asset not deployed");
            const runtime=await get("/weather/data/weather-runtime/manifest.json");
            const manifest=JSON.parse(runtime.body);
            if(manifest.pipeline_version!=="OPENPQ_CMS_WEATHER_V1")
              throw Error("CMS independent weather-runtime manifest missing");
          }
          let lastError;
          for(let attempt=1;attempt<=16;attempt++){
            try{
              await verify(attempt);
              console.log("Verified CMS custom domain, build "+expected+
                ", library "+expectedCount+", Weather guard, runtime and admin on attempt "+attempt);
              process.exit(0);
            }catch(error){
              lastError=error;
              console.log("CMS propagation check "+attempt+"/16:",error.message);
              if(attempt<16)await delay(10000);
            }
          }
          throw Error("CMS custom domain did not serve verified build and Weather after CDN propagation: "+lastError?.message);
          NODE

      - name: Independently check the live CMS hostname
        if: always()
        run: |
          node <<'NODE'
          const root="https://cms.openphuquoc.com";
          const paths=["/","/data/views/knowledge-public.json","/guide/knowledge.html","/admin/","/weather/","/weather/data/weather-runtime/manifest.json"];
          (async()=>{
            for(const path of paths){
              const label=path;
              try{
                const r=await fetch(root+path+"?v="+process.env.GITHUB_SHA,{signal:AbortSignal.timeout(12000),headers:{"Cache-Control":"no-cache"}});
                const contentType=r.headers.get("content-type")||"";
                const body=await r.text();
                const count=contentType.includes("json")?JSON.parse(body).count:null;
                const markers={
                  library:body.includes('data-knowledge-page="library"'),
                  adminVersion21:body.includes("admin.js?v=21")
                };
                console.log("CMS live",label,"HTTP",r.status,"content-type",contentType,"count",count,"weather-v3",body.includes("/weather/weather-v2.js"),"weather-standalone",body.includes("OPENPQ_CMS_WEATHER_V1"),"library",markers.library,"admin-v21",markers.adminVersion21);
              }catch(e){console.log("CMS live",label,"unreachable:",e.message);}
            }
            for(const path of ["/","/guide/knowledge.html","/data/views/knowledge-public.json","/weather/","/weather/data/weather-runtime/manifest.json"]){
              try{
                const r=await fetch("https://openphuquoc.com"+path+"?v="+process.env.GITHUB_SHA,{signal:AbortSignal.timeout(8000),headers:{"Cache-Control":"no-cache"}});
                const contentType=r.headers.get("content-type")||"";
                const body=await r.text();
                const count=contentType.includes("json")?JSON.parse(body).count:null;
                console.log("Public apex",path,"HTTP",r.status,"home-library",body.includes('id="home-library"'),"weather-v3",body.includes("/weather/weather-v2.js"),"weather-standalone",body.includes("OPENPQ_CMS_WEATHER_V1"),"count",count);
              }catch(e){console.log("Public apex",path,"unreachable:",e.message);}
            }
          })();
          NODE

      - name: Fail when CMS Pages deployment is unavailable
        if: steps.discover.outputs.ready != 'true'
        run: |
          echo "::error::CMS build passed but deployment was skipped. Check the Cloudflare account, Pages Read/Edit token scope, project discovery and cms.openphuquoc.com domain mapping."
          exit 1
