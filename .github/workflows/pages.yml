name: Deploy Open Phu Quoc

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build derived data views
        run: node scripts/build-search-index.mjs
      - name: Validate data contracts
        run: node scripts/validate-data.mjs
      - name: Test search ranking and grouping
        run: node scripts/test-search.mjs
      - name: Validate Cloudflare CMS bundle
        run: |
          node scripts/build-cloudflare.mjs
          test -f dist/about/index.html
          test -f dist/about/about.css
          test -f dist/visual-context.css
          test -f dist/visual-context.js
          rm -rf dist
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
