name: Deploy Open Phu Quoc

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build derived data views
        run: |
          node scripts/build-knowledge-public.mjs
          node scripts/validate-cms-publication.mjs
          node scripts/build-search-index.mjs
          node scripts/build-map-coverage.mjs
          node scripts/build-location-index.mjs
      - name: Validate data contracts
        run: |
          node scripts/validate-data.mjs
          node scripts/validate-home-support.mjs
          node scripts/validate-knowledge.mjs
      - name: Test search ranking and grouping
        run: node scripts/test-search.mjs
      - name: Test Near Me coordinates and zones
        run: node scripts/test-nearme-venues.mjs
      - name: Test CMS permission revocation
        run: node scripts/test-cms-access.mjs
      - name: Test Vietcombank currency parser
        run: node scripts/test-currency.mjs
      - name: Validate Cloudflare CMS bundle
        run: |
          node scripts/build-cloudflare.mjs
          test -f dist/about/index.html
          test -f dist/about/about.css
          test -f dist/visual-context.css
          test -f dist/visual-context.js
          test -f dist/home-foundation-v2.js
          test -f dist/currency/index.html
          test -f dist/currency/currency.js
          test ! -e dist/data/knowledge/objects.json
          test ! -e dist/data/knowledge/backlog.json
          test -f dist/guide/article.html
          test -f dist/guide/knowledge.html
          node --check guide/knowledge.js
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
