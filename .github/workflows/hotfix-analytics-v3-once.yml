name: Hotfix - Deploy Analytics V3 Once

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Cloudflare account
        env:
          CF_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(python - <<'PY'
          import json, os, urllib.request
          token=os.environ["CF_API_TOKEN"].strip()
          req=urllib.request.Request("https://api.cloudflare.com/client/v4/accounts",headers={
            "Authorization":"Bearer "+token,
            "Content-Type":"application/json",
            "User-Agent":"OpenPQ-AnalyticsV3/1.0",
          })
          with urllib.request.urlopen(req,timeout=20) as r:
            rows=(json.loads(r.read().decode()).get("result") or [])
          if not rows: raise SystemExit("No Cloudflare account")
          print(rows[0]["id"])
          PY
          )"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
      - name: Build and validate
        run: |
          set -euo pipefail
          node --check admin/admin.js
          node --check admin/analytics-v3.js
          node --check functions/api/cms/analytics.js
          node scripts/build-cloudflare.mjs
          test -f dist/admin/analytics-v3.js
          grep -q 'analytics-v3.js?v=1' dist/admin/index.html
          grep -q 'sideToggle' dist/admin/index.html
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 pages deploy dist --project-name jotrip-home --branch main --commit-dirty=true
      - name: Verify production
        run: |
          set -euo pipefail
          ok=0
          for i in {1..25}; do
            curl -fsS "https://cms.openphuquoc.com/admin/analytics-v3.js?v=1&t=$i" -o a3.js || true
            curl -fsS "https://cms.openphuquoc.com/admin/admin.js?v=20&t=$i" -o admin.js || true
            if grep -q 'OPQAnalyticsV3' a3.js && grep -q 'bindSidebarToggle' admin.js; then
              ok=1; break
            fi
            sleep 3
          done
          echo "analytics_v3_live=$ok"
          test "$ok" = "1"
