name: Diagnostic - Check OpenPQ D1 Binding Once

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-binding:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect jotrip-home Pages bindings
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          token=os.environ["CF_API_TOKEN"].strip()
          def get(url):
              req=urllib.request.Request(url,headers={
                  "Authorization":"Bearer "+token,
                  "Content-Type":"application/json",
                  "User-Agent":"OpenPQ-Binding-Diagnostic/1.0",
              })
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.loads(r.read().decode())
          accounts=get("https://api.cloudflare.com/client/v4/accounts").get("result") or []
          assert accounts, "No Cloudflare account"
          account_id=accounts[0]["id"]
          projects=get(f"https://api.cloudflare.com/client/v4/accounts/{account_id}/pages/projects").get("result") or []
          target=next((p for p in projects if p.get("name")=="jotrip-home"),None)
          assert target, "jotrip-home not found"
          prod=((target.get("deployment_configs") or {}).get("production") or {})
          d1=prod.get("d1_databases") or {}
          print("production_d1=", json.dumps(d1,ensure_ascii=False))
          print("openpq_binding_present=", "OPENPQ_DB" in d1)
          if "OPENPQ_DB" in d1:
              print("openpq_binding_value=", json.dumps(d1["OPENPQ_DB"],ensure_ascii=False))
          PY
