name: Open Phu Quoc Utility AutoSync

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0,12 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sync official utility contacts
        run: node tools/utility-sync/collect.mjs
      - name: Commit updated utility data
        run: |
          if git diff --quiet -- data/utilities.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "openphuquoc-autosync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/utilities.json
          git commit -m "data: refresh official utility contacts"
          git push
