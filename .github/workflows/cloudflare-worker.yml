name: Deploy Open Phu Quoc Worker

on:
  push:
    branches: ["main"]
    paths:
      - "data/knowledge/**"
      - "data/entities/utilities.json"
      - "data/entities/nearme-essential-*.json"
      - "data/home-support.json"
      - "data/views/location-index.json"
      - "data/views/map-coverage.json"
      - "nearme/**"
      - "home-nearme-v2.js"
      - "scripts/build-location-index.mjs"
      - "scripts/build-map-coverage.mjs"
      - "guide/**"
      - "index.html"
      - "styles.css"
      - "scripts/validate-home-knowledge.mjs"
      - "scripts/build-knowledge-public.mjs"
      - "scripts/build-search-index.mjs"
      - "scripts/build-cloudflare.mjs"
      - "weather/**"
      - "scripts/weather-cms-*.mjs"
      - "scripts/weather-engine/**"
      - "worker.js"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openphuquoc-worker
  cancel-in-progress: true

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CMS weather collectors
        run: python -m pip install --quiet boto3 s3fs xarray h5netcdf h5py numpy pyproj

      - name: Build derived data
        run: |
          node scripts/build-knowledge-public.mjs
          node -e "const x=require('./data/views/knowledge-public.json'); if(x.count!==128) process.exit(1)"
          node scripts/build-search-index.mjs
          node scripts/build-map-coverage.mjs
          node scripts/build-location-index.mjs

      - name: Validate data
        run: |
          node scripts/validate-data.mjs
          node scripts/validate-home-support.mjs
          node scripts/validate-knowledge.mjs
          node scripts/validate-home-knowledge.mjs
          node scripts/test-search.mjs
          node scripts/test-currency.mjs

      - name: Check public knowledge
        run: |
          node --check guide/knowledge.js
          node --check worker.js

      - name: Build Worker assets
        run: |
          node scripts/weather-cms-sync.mjs --strict
          node scripts/weather-cms-smoke.mjs
          node scripts/build-cloudflare.mjs
          printf '{"sha":"%s","built_at":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/build.json
          test -f dist/index.html
          test -f dist/home-foundation-v2.js
          test -f dist/currency/index.html
          test -f dist/transit/index.html

      - name: Check Cloudflare credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_READY=true" >> "$GITHUB_ENV"
            echo "Cloudflare credentials available."
          else
            echo "CLOUDFLARE_READY=false" >> "$GITHUB_ENV"
            echo "::warning::Worker deploy skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
          fi

      - name: Deploy openphuquoc-v3 Worker
        if: env.CLOUDFLARE_READY == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4.136.3"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc


      - name: Verify deployed Worker version and knowledge pages
        if: env.CLOUDFLARE_READY == 'true'
        run: |
          base="https://openphuquoc-v3.kenzuko.workers.dev"
          ok=false
          for i in {1..20}; do
            body="$(curl -fsS "$base/build.json?t=$GITHUB_SHA" || true)"
            if echo "$body" | grep -q "$GITHUB_SHA"; then
              echo "Worker build matches $GITHUB_SHA"
              ok=true
              break
            fi
            sleep 2
          done
          if [ "$ok" != true ]; then
            echo "::error::Worker build.json did not match commit $GITHUB_SHA"
            exit 1
          fi
          curl -fsS "$base/data/views/knowledge-public.json?t=$GITHUB_SHA" | node -e 'let x="";process.stdin.on("data",c=>x+=c);process.stdin.on("end",()=>{const v=JSON.parse(x);if(v.count!==128||v.objects?.length!==128||x.includes("\"research\"")||x.includes("\"sources\""))process.exit(1);console.log("Public articles:",v.count);})'
          curl -fsSL "$base/guide/knowledge.html?t=$GITHUB_SHA" -o /tmp/knowledge-library.html
          if ! grep -q 'data-knowledge-page="library"' /tmp/knowledge-library.html; then
            echo "::error::Library page did not return its expected HTML"
            head -c 500 /tmp/knowledge-library.html
            exit 1
          fi
          curl -fsSL "$base/guide/article.html?id=knowledge_001_dinh-cau&t=$GITHUB_SHA" -o /tmp/knowledge-article.html
          if ! grep -q 'data-knowledge-page="article"' /tmp/knowledge-article.html; then
            echo "::error::Article page did not return its expected HTML"
            head -c 500 /tmp/knowledge-article.html
            exit 1
          fi
          private="$(curl -fsS "$base/data/knowledge/objects.json" || true)"
          if echo "$private" | grep -q '"research"'; then
            echo "::error::Internal research unexpectedly served as a public asset"
            exit 1
          fi
      - name: Check openphuquoc.com content routing
        if: env.CLOUDFLARE_READY == 'true'
        run: |
          domain="$(curl --connect-timeout 4 --max-time 10 -fsS 'https://openphuquoc.com/data/views/knowledge-public.json' || true)"
          if echo "$domain" | grep -Eq '"count"[[:space:]]*:[[:space:]]*128'; then
            echo "openphuquoc.com exposes 128 published articles"
          else
            echo "::warning::openphuquoc.com is not yet verified as serving the current knowledge view; check domain routing separately."
          fi

      - name: Install production smoke browser
        if: env.CLOUDFLARE_READY == 'true'
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Smoke test production homepage
        if: env.CLOUDFLARE_READY == 'true'
        env:
          VISUAL_QA_BASE_URL: https://openphuquoc-v3.kenzuko.workers.dev
          VISUAL_QA_SCOPE: home
          VISUAL_QA_OUTPUT: production-smoke-results
        run: node scripts/visual-qa.mjs

      - name: Upload production smoke report
        if: always() && env.CLOUDFLARE_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openpq-cms-production-smoke-${{ github.run_number }}
          path: production-smoke-results/
          retention-days: 7
          if-no-files-found: warn
