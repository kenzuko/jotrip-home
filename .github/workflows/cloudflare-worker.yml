name: Deploy Open Phu Quoc Worker
# Direct Wrangler deploy from GitHub Actions; independent of Cloudflare Builds quota.

on:
  push:
    branches: ["main"]
    paths:
      - "data/knowledge/**"
      - "data/content.json"
      - "data/home-copy.json"
      - "data/i18n/**"
      - "core/i18n-*.js"
      - "functions/_shared/i18n-content.js"
      - "functions/_shared/i18n.js"
      - "scripts/build-i18n-catalog.mjs"
      - "scripts/test-i18n-*.mjs"
      - "data/entities/food.json"
      - "data/go-config.json"
      - "data/entities/places.json"
      - "data/entities/activities.json"
      - "data/entities/utilities.json"
      - "data/entities/nearme-essential-*.json"
      - "data/open/**"
      - "data/home-support.json"
      - "data/operational-notices.json"
      - "data/views/location-index.json"
      - "data/views/map-coverage.json"
      - "nearme/**"
      - "home-nearme-v2.js"
      - "scripts/build-location-index.mjs"
      - "scripts/check-derived-views-sync.mjs"
      - "scripts/build-map-coverage.mjs"
      - "guide/**"
      - "stories/**"
      - "food/**"
      - "places/**"
      - "explore/**"
      - "about/**"
      - "airport/**"
      - "bus/**"
      - "cano/**"
      - "currency/**"
      - "ferry/**"
      - "hotels/**"
      - "transit/**"
      - "utilities/**"
      - "core/site-copy.js"
      - "core/weather-human-contract.js"
      - "scripts/test-weather-human-contract.mjs"
      - "core/traffic.js"
      - "functions/_shared/traffic-analytics.js"
      - "functions/_shared/owner-traffic-auth.js"
      - "functions/api/traffic/**"
      - "functions/api/cms/traffic.js"
      - "functions/api/ops/**"
      - "admin/traffic-dashboard.*"
      - "scripts/build-public-traffic.mjs"
      - "scripts/test-traffic-*.mjs"
      - "news/**"
      - "index.html"
      - "home-*.js"
      - "home-live-v3.js"
      - "places/detail.js"
      - "styles.css"
      - "scripts/validate-home-knowledge.mjs"
      - "scripts/validate-public-copy.mjs"
      - "scripts/build-knowledge-public.mjs"
      - "scripts/build-search-index.mjs"
      - "scripts/build-cloudflare.mjs"
      - "scripts/visual-qa.mjs"
      - "scripts/test-article-card-links.mjs"
      - "scripts/test-home-nearme.mjs"
      - "scripts/visual-qa-article-cards.mjs"
      - "weather/**"
      - "scripts/weather-cms-*.mjs"
      - "scripts/weather-engine/**"
      - "worker.js"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openphuquoc-worker
  cancel-in-progress: false

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check committed Near Me indexes before regenerating
        run: node scripts/check-derived-views-sync.mjs
      - name: Install CMS weather collectors
        run: python -m pip install --quiet boto3 s3fs xarray h5netcdf h5py numpy pyproj

      - name: Build derived data
        run: |
          node scripts/build-knowledge-public.mjs
          node -e "const x=require('./data/views/knowledge-public.json'); if(x.count!==128) process.exit(1)"
          node scripts/build-search-index.mjs
          node scripts/build-map-coverage.mjs
          node scripts/build-location-index.mjs

      - name: Validate data
        run: |
          node scripts/validate-data.mjs
          node scripts/validate-home-support.mjs
          node scripts/validate-knowledge.mjs
          node scripts/validate-home-knowledge.mjs
          node scripts/validate-public-copy.mjs
          node scripts/test-search.mjs
          node scripts/test-currency.mjs
          node scripts/test-weather-human-contract.mjs
          node scripts/test-transit-snapshot-health.mjs

      - name: Check public knowledge
        run: |
          node --check guide/knowledge.js
          node --check worker.js

      - name: Test production Weather Ground Truth engine
        env:
          PYTHONPATH: scripts/weather-engine
        run: python -m unittest discover -s scripts/weather-engine/weather/tests -v

      - name: Test Weather V2 Ground Truth UI contract
        run: |
          node --check weather/weather-v2.js
          node scripts/weather-v2-groundtruth-ui.test.mjs

      - name: Build Worker assets
        run: |
          # Fail closed. The last deployed Worker is our Last Known Good.
          # Never ship a stale Git-checkout snapshot as a successful fallback.
          node scripts/weather-cms-sync.mjs --strict
          node scripts/weather-release-guard.test.mjs
          node scripts/weather-autorecover.test.mjs
          node scripts/weather-cms-smoke.mjs
          node scripts/weather-cms-runtime-identity.test.mjs
          node scripts/build-cloudflare.mjs
          printf '{"sha":"%s","built_at":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/build.json
          test -f dist/index.html
          test -f dist/home-foundation-v2.js
          test -f dist/core/weather-human-contract.js
          test -f dist/currency/index.html
          test -f dist/transit/index.html

      - name: Check Cloudflare credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_READY=true" >> "$GITHUB_ENV"
            echo "Cloudflare credentials available."
          else
            echo "CLOUDFLARE_READY=false" >> "$GITHUB_ENV"
            echo "::warning::Worker deploy skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
          fi

      - name: Confirm this run is still current main
        run: |
          CURRENT_MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "Current main: $CURRENT_MAIN_SHA"
          echo "This run:     $GITHUB_SHA"
          if [ "$CURRENT_MAIN_SHA" = "$GITHUB_SHA" ]; then
            echo "OPENPQ_CURRENT_HEAD=true" >> "$GITHUB_ENV"
          else
            echo "OPENPQ_CURRENT_HEAD=false" >> "$GITHUB_ENV"
            echo "::notice::Skipping stale Worker deploy for $GITHUB_SHA because main is now $CURRENT_MAIN_SHA"
          fi

      - name: Verify production Weather does not roll back
        if: env.CLOUDFLARE_READY == 'true' && env.OPENPQ_CURRENT_HEAD == 'true'
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$CURRENT_MAIN_SHA" = "$GITHUB_SHA" || { echo "::error::Main moved after release verification"; exit 1; }
          curl -fsSL --retry 3 --retry-delay 2 --max-time 20 \
            "https://openphuquoc-v3.kenzuko.workers.dev/weather/data/weather-runtime/manifest.json?release-check=$GITHUB_SHA" \
            -o /tmp/openpq-deployed-weather-manifest.json
          node scripts/weather-release-guard.mjs \
            dist/weather/data/weather-runtime/manifest.json \
            /tmp/openpq-deployed-weather-manifest.json dist/weather-release.json
          echo "OPENPQ_WEATHER_RELEASE_READY=true" >> "$GITHUB_ENV"

      - name: Deploy openphuquoc-v3 Worker
        if: env.CLOUDFLARE_READY == 'true' && env.OPENPQ_CURRENT_HEAD == 'true' && env.OPENPQ_WEATHER_RELEASE_READY == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4.136.3"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc


      - name: Verify deployed Worker version and knowledge pages
        if: env.CLOUDFLARE_READY == 'true' && env.OPENPQ_CURRENT_HEAD == 'true'
        run: |
          base="https://openphuquoc-v3.kenzuko.workers.dev"
          ok=false
          for i in {1..20}; do
            body="$(curl -fsS "$base/build.json?t=$GITHUB_SHA" || true)"
            if echo "$body" | grep -q "$GITHUB_SHA"; then
              echo "Worker build matches $GITHUB_SHA"
              ok=true
              break
            fi
            sleep 2
          done
          if [ "$ok" != true ]; then
            echo "::error::Worker build.json did not match commit $GITHUB_SHA"
            exit 1
          fi
          curl -fsS "$base/data/views/knowledge-public.json?t=$GITHUB_SHA" | node -e 'let x="";process.stdin.on("data",c=>x+=c);process.stdin.on("end",()=>{const v=JSON.parse(x);if(v.count!==128||v.objects?.length!==128||x.includes("\"research\"")||x.includes("\"sources\""))process.exit(1);console.log("Public articles:",v.count);})'
          curl -fsSL "$base/guide/knowledge.html?t=$GITHUB_SHA" -o /tmp/knowledge-library.html
          if ! grep -q 'data-knowledge-page="library"' /tmp/knowledge-library.html; then
            echo "::error::Library page did not return its expected HTML"
            head -c 500 /tmp/knowledge-library.html
            exit 1
          fi
          curl -fsSL "$base/guide/article.html?id=knowledge_001_dinh-cau&t=$GITHUB_SHA" -o /tmp/knowledge-article.html
          if ! grep -q 'data-knowledge-page="article"' /tmp/knowledge-article.html; then
            echo "::error::Article page did not return its expected HTML"
            head -c 500 /tmp/knowledge-article.html
            exit 1
          fi
          private="$(curl -fsS "$base/data/knowledge/objects.json" || true)"
          if echo "$private" | grep -q '"research"'; then
            echo "::error::Internal research unexpectedly served as a public asset"
            exit 1
          fi
      - name: Install production smoke browser
        if: env.CLOUDFLARE_READY == 'true' && env.OPENPQ_CURRENT_HEAD == 'true'
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Smoke test production homepage
        if: env.CLOUDFLARE_READY == 'true' && env.OPENPQ_CURRENT_HEAD == 'true'
        env:
          VISUAL_QA_BASE_URL: https://openphuquoc-v3.kenzuko.workers.dev
          VISUAL_QA_SCOPE: home
          VISUAL_QA_OUTPUT: production-smoke-results
        run: node scripts/visual-qa.mjs

      - name: Production sanity check
        if: env.CLOUDFLARE_READY == 'true' && env.OPENPQ_CURRENT_HEAD == 'true'
        run: |
          origin="https://openphuquoc.com"
          ok=false
          for i in {1..20}; do
            body="$(curl -fsS "$origin/build.json?t=$GITHUB_SHA" || true)"
            if echo "$body" | grep -q "$GITHUB_SHA"; then ok=true; break; fi
            sleep 2
          done
          if [ "$ok" != true ]; then
            echo "::error::Canonical production build.json did not match $GITHUB_SHA"
            exit 1
          fi
          for path in / /go/ /nearme/ /explore/ /weather/ /airport/ /transit/ /bus/ /cano/ /utilities/ /currency/ /guide/knowledge.html /robots.txt /sitemap.xml; do
            curl -fsSL "$origin$path" -o /dev/null || { echo "::error::Production route failed: $path"; exit 1; }
          done
          curl -fsSL "$origin/" -o /tmp/openpq-home.html
          grep -Fq '<link rel="canonical" href="https://openphuquoc.com/">' /tmp/openpq-home.html || { echo "::error::Homepage canonical is missing or incorrect"; exit 1; }
          curl -fsSL "$origin/robots.txt" -o /tmp/openpq-robots.txt
          grep -Fq 'Sitemap: https://openphuquoc.com/sitemap.xml' /tmp/openpq-robots.txt
          grep -Fq 'Disallow: /admin/' /tmp/openpq-robots.txt
          grep -Fq 'Disallow: /api/' /tmp/openpq-robots.txt
          grep -Fq 'Disallow: /cms/' /tmp/openpq-robots.txt
          curl -fsSL "$origin/sitemap.xml" -o /tmp/openpq-sitemap.xml
          grep -Fq '<loc>https://openphuquoc.com/</loc>' /tmp/openpq-sitemap.xml
          if grep -Fq 'cms.openphuquoc.com' /tmp/openpq-sitemap.xml; then echo "::error::CMS hostname leaked into sitemap"; exit 1; fi
          guide_count="$(grep -o '/guide/article.html?id=' /tmp/openpq-sitemap.xml | wc -l | tr -d ' ')"
          if [ "$guide_count" -lt 128 ]; then echo "::error::Production sitemap exposes only $guide_count knowledge articles"; exit 1; fi
          www_status="$(curl -sS -o /dev/null -D /tmp/openpq-www.headers -w '%{http_code}' https://www.openphuquoc.com/)"
          www_location="$(awk 'tolower($1)=="location:" {print $2; exit}' /tmp/openpq-www.headers | tr -d '\r')"
          if [ "$www_status" != "301" ] || [ "$www_location" != "https://openphuquoc.com/" ]; then
            echo "::error::www redirect invalid: status=$www_status location=$www_location"
            exit 1
          fi
          echo "Production sanity PASS: canonical, key routes, robots, sitemap, www redirect"

      - name: Upload production smoke report
        if: always() && env.CLOUDFLARE_READY == 'true' && env.OPENPQ_CURRENT_HEAD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openpq-cms-production-smoke-${{ github.run_number }}
          path: production-smoke-results/
          retention-days: 7
          if-no-files-found: warn
