name: Build English machine drafts

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: openpq-translate-english
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    env:
      AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
      AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Azure secret
        run: |
          if [ -z "$AZURE_TRANSLATOR_KEY" ]; then
            echo "Missing repository secret AZURE_TRANSLATOR_KEY"
            exit 1
          fi

      - name: Validate source and estimate English workload
        run: |
          npm run i18n:check
          node scripts/i18n-pipeline.mjs plan --family ui --locale en
          node scripts/i18n-pipeline.mjs plan --family food --locale en
          node scripts/i18n-pipeline.mjs plan --family stories --locale en
          node scripts/i18n-pipeline.mjs plan --family knowledge --locale en

      - name: Translate all English families
        run: |
          node scripts/i18n-pipeline.mjs translate --family ui --locale en --apply
          sleep 12
          node scripts/i18n-pipeline.mjs translate --family food --locale en --apply
          sleep 12
          node scripts/i18n-pipeline.mjs translate --family stories --locale en --apply
          sleep 12
          node scripts/i18n-pipeline.mjs translate --family knowledge --locale en --apply

      - name: Validate machine drafts
        run: npm run i18n:check

      - name: Commit drafts to a review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="translation/en-machine-draft-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "openpq-translation-bot"
          git config user.email "openpq-translation-bot@users.noreply.github.com"
          git add cms/translation-lifecycle.json cms/translation-memory.json data/i18n/en
          git commit -m "i18n: generate English machine drafts"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "i18n: review English machine drafts" \
            --body "Azure-generated English machine drafts for UI, Food, Stories and Knowledge. Nothing is published. Human editorial review and locale enablement remain required."
