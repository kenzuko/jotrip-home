name: Build English machine drafts

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: openpq-translate-english
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    env:
      AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
      AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
      TRANSLATION_BRANCH: translation/en-machine-draft
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Azure secret
        run: |
          if [ -z "$AZURE_TRANSLATOR_KEY" ]; then
            echo "Missing repository secret AZURE_TRANSLATOR_KEY"
            exit 1
          fi

      - name: Resume or create translation checkpoint branch
        run: |
          git config user.name "openpq-translation-bot"
          git config user.email "openpq-translation-bot@users.noreply.github.com"
          git fetch origin main "$TRANSLATION_BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$TRANSLATION_BRANCH"; then
            git switch -C "$TRANSLATION_BRANCH" "origin/$TRANSLATION_BRANCH"
            git merge --no-edit origin/main
          else
            git switch -c "$TRANSLATION_BRANCH"
          fi

      - name: Validate source and estimate English workload
        run: |
          npm run i18n:check
          node scripts/i18n-pipeline.mjs plan --family ui --locale en
          node scripts/i18n-pipeline.mjs plan --family food --locale en
          node scripts/i18n-pipeline.mjs plan --family stories --locale en
          node scripts/i18n-pipeline.mjs plan --family knowledge --locale en

      - name: Translate English UI
        run: node scripts/i18n-pipeline.mjs translate --family ui --locale en --apply
      - name: Checkpoint English UI
        run: |
          git add cms/translation-lifecycle.json cms/translation-memory.json data/i18n/en
          git diff --cached --quiet || git commit -m "i18n: checkpoint English UI"
          git push -u origin "$TRANSLATION_BRANCH"

      - name: Translate English Food
        run: node scripts/i18n-pipeline.mjs translate --family food --locale en --apply
      - name: Checkpoint English Food
        run: |
          git add cms/translation-lifecycle.json cms/translation-memory.json data/i18n/en
          git diff --cached --quiet || git commit -m "i18n: checkpoint English Food"
          git push origin "$TRANSLATION_BRANCH"

      - name: Translate English Stories
        run: node scripts/i18n-pipeline.mjs translate --family stories --locale en --apply
      - name: Checkpoint English Stories
        run: |
          git add cms/translation-lifecycle.json cms/translation-memory.json data/i18n/en
          git diff --cached --quiet || git commit -m "i18n: checkpoint English Stories"
          git push origin "$TRANSLATION_BRANCH"

      - name: Translate English Knowledge
        run: node scripts/i18n-pipeline.mjs translate --family knowledge --locale en --apply
      - name: Checkpoint English Knowledge
        run: |
          git add cms/translation-lifecycle.json cms/translation-memory.json data/i18n/en
          git diff --cached --quiet || git commit -m "i18n: checkpoint English Knowledge"
          git push origin "$TRANSLATION_BRANCH"

      - name: Validate machine drafts
        run: npm run i18n:check

      - name: Open or report review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh pr list --base main --head "$TRANSLATION_BRANCH" --state open --json url --jq '.[0].url')"
          if [ -n "$existing" ]; then
            echo "Review PR already open: $existing"
          else
            gh pr create \
              --base main \
              --head "$TRANSLATION_BRANCH" \
              --title "i18n: review English machine drafts" \
              --body "Azure-generated English machine drafts for UI, Food, Stories and Knowledge. Nothing is published. Human editorial review and locale enablement remain required."
          fi

      - name: Save partial memory after failure
        if: failure()
        run: |
          git add cms/translation-memory.json cms/translation-lifecycle.json data/i18n/en 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "i18n: save partial English translation checkpoint"
            git push -u origin "$TRANSLATION_BRANCH"
          fi
