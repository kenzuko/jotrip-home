name: Validate Open Phu Quoc V3

on:
  push:
    branches: ["feat/openpq-superapp-v3"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build public knowledge view
        run: node scripts/build-knowledge-public.mjs
      - name: Build derived Near Me data
        run: |
          node scripts/build-map-coverage.mjs
          node scripts/build-location-index.mjs
          node scripts/build-search-index.mjs
      - name: Validate data contracts
        run: node scripts/validate-data.mjs
      - name: Test Transit compact mobile display
        run: |
          node scripts/test-transit-mobile-ui.mjs
          node --check transit/app.js
      - name: Test CMS attraction timing decision
        run: |
          node scripts/validate-home-support.mjs
          node scripts/test-trip-clock-planner.mjs
          node scripts/test-home-nearme.mjs
          node --check home-nearme-v2.js
          node --check core/trip-clock-planner.js
          node --check home-foundation-v2.js
      - name: Test GO island map viewport and radius overlays
        run: |
          node scripts/test-go-geo.mjs
          node scripts/test-decision-signals.mjs
          node scripts/test-go-live-api.mjs
          node scripts/test-shared-area-and-schedules.mjs
          node --check go/go-map.js
          node --check go/go.js
          node --check core/decision-signals.js
          node --check go/live-adapter.js
      - name: Validate natural public-facing Vietnamese
        run: node scripts/validate-public-copy.mjs
      - name: Test search ranking and grouping
        run: node scripts/test-search.mjs
      - name: Test current CMS permissions
        run: node scripts/test-cms-access.mjs
      - name: Test CMS draft review workflow
        run: node scripts/test-cms-draft-review.mjs
      - name: Test CMS review queue
        run: node scripts/test-cms-review-queue.mjs
      - name: Test CMS field-level review diff
        run: node scripts/test-cms-review-diff.mjs
      - name: Test CMS rollback proposals
        run: node scripts/test-cms-rollback.mjs
      - name: Test CMS quality queue
        run: node scripts/test-cms-quality.mjs
      - name: Test CMS quality task navigation
        run: node scripts/test-cms-quality-navigation.mjs
      - name: Test CMS unified task center
        run: node scripts/test-cms-task-center.mjs
      - name: Test food entity ID mapping
        run: node scripts/test-food-id-mapping.mjs
      - name: Test Near Me venue pins and canonical places
        run: |
          node scripts/test-nearme-venues.mjs
          node scripts/test-nearme-mobile-layout.mjs
      - name: Test weather map points match production coordinates
        run: node scripts/test-weather-map-coordinates.mjs
      - name: Test Vietcombank currency parser
        run: node scripts/test-currency.mjs
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check core/search-engine.js
          node --check core/today-engine-v2.js
          node --check home-live-v3.js
          node --check home-today-v3.js
          node --check places/app.js
          node --check guide/guide.js
          node --check guide/knowledge.js
          node --check worker.js
          node --check utilities/utilities.js
          node --check functions/api/cms/session.js
          node --check functions/api/cms/content.js
          node --check functions/api/cms/analytics.js
          node --check functions/api/cms/publish.js
          node --check functions/api/cms/reviews.js
          node --check functions/api/cms/review-diff.js
          node --check functions/api/cms/rollback.js
          node --check functions/api/cms/quality.js
          node --check admin/reviews.js
          node --check admin/quality.js
          node --check admin/admin.js
          node --check nearme/nearme.js
          node --check nearme/venue-normalizer.js
          node --check explore/app.js
          node --check places/detail.js
          node --check hotels/app.js
          node --check transit/app.js
          node --check currency/currency.js
          node --check workers/currency/src/index.js
      - name: Validate Cloudflare route bundle
        run: |
          node scripts/build-cloudflare.mjs
          test ! -e dist/data/knowledge/objects.json
          test -f dist/guide/knowledge.html
          test -f dist/guide/article.html
          test -f dist/transit/index.html
          test -f dist/transit/app.js
          test -f dist/currency/index.html
          test -f dist/currency/currency.js
          rm -rf dist
