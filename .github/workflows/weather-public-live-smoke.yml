name: Weather public live smoke

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "home-live-v3.js"
      - "weather/**"
      - "functions/_shared/weather-edge.js"
      - "functions/weather/**"
      - "worker.js"
      - "scripts/weather-public-live-smoke.mjs"
      - ".github/workflows/weather-public-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weather-public-live-smoke
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate live smoke syntax
        run: node --check scripts/weather-public-live-smoke.mjs
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.63.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for this production release
        run: |
          ok=false
          for i in {1..72}; do
            build="$(curl -fsSL "https://openphuquoc.com/build.json?t=$GITHUB_SHA-$i" || true)"
            if echo "$build" | grep -Fq "$GITHUB_SHA"; then
              body="$(curl -fsSL "https://openphuquoc.com/weather/?v3-smoke=$GITHUB_SHA-$i" || true)"
              if echo "$body" | grep -Fq 'class="weather-version-badge"' &&                  echo "$body" | grep -Fq 'id="v3ObservationPanel"' &&                  echo "$body" | grep -Fq 'weather-now-primary human-first'; then
                echo "Canonical Human Layer release $GITHUB_SHA is visible."
                ok=true
                break
              fi
            fi
            sleep 5
          done
          if [ "$ok" != true ]; then
            echo "::error::Canonical Human Layer release $GITHUB_SHA did not become visible within the release window."
            exit 1
          fi
      - name: Verify homepage and canonical Weather
        env:
          OPENPQ_BASE: https://openphuquoc.com
        run: node scripts/weather-public-live-smoke.mjs
