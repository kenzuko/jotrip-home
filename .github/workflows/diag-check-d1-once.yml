name: Diagnostic - Check Cloudflare D1 Once

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-d1:
    runs-on: ubuntu-latest
    steps:
      - name: Query Cloudflare D1 inventory
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CF_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN_MISSING"
            exit 2
          fi
          python - <<'PY'
          import json, os, urllib.request, urllib.parse

          token=os.environ["CF_API_TOKEN"].strip()
          raw_account=os.environ.get("CF_ACCOUNT_ID","").strip().strip('"').strip("'")
          if "=" in raw_account and raw_account.upper().startswith("CLOUDFLARE_ACCOUNT_ID="):
              raw_account=raw_account.split("=",1)[1].strip().strip('"').strip("'")

          def get(url):
              req=urllib.request.Request(url, headers={
                  "Authorization": "Bearer "+token,
                  "Content-Type": "application/json",
                  "User-Agent": "OpenPQ-D1-Diagnostic/1.0",
              })
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status, json.loads(r.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  try:
                      body=json.loads(e.read().decode("utf-8"))
                  except Exception:
                      body={"errors":[{"message":str(e)}]}
                  return e.code, body

          accounts=[]
          status,doc=get("https://api.cloudflare.com/client/v4/accounts?per_page=50")
          print("accounts_http_status=", status)
          if doc.get("success"):
              accounts=[(str(x.get("id") or ""),x.get("name")) for x in (doc.get("result") or []) if x.get("id")]
          else:
              for e in doc.get("errors") or []:
                  print("accounts_error=", e.get("code"), e.get("message"))

          if not accounts and raw_account:
              accounts=[(raw_account,"from-secret")]

          print("account_count=", len(accounts))
          total=0
          for ai,(account_id,account_name) in enumerate(accounts,1):
              if not account_id:
                  continue
              url="https://api.cloudflare.com/client/v4/accounts/"+urllib.parse.quote(account_id,safe="")+"/d1/database?per_page=100"
              status,doc=get(url)
              print(f"account_{ai}: name={account_name} d1_http_status={status} success={doc.get('success')}")
              if not doc.get("success"):
                  for e in doc.get("errors") or []:
                      print("d1_error=", e.get("code"), e.get("message"))
                  continue
              rows=doc.get("result") or []
              total+=len(rows)
              for i,row in enumerate(rows,1):
                  ident=str(row.get("uuid") or row.get("id") or "")
                  print(f"d1: name={row.get('name')} id_prefix={ident[:8]} created_at={row.get('created_at')}")
          print("d1_total=", total)
          PY
