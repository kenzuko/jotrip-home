name: Diagnostic - Verify Analytics V2 Production Once

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Cloudflare production deployment
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          token=os.environ["CF_API_TOKEN"].strip()
          def get(url):
              req=urllib.request.Request(url,headers={"Authorization":"Bearer "+token,"Content-Type":"application/json","User-Agent":"OpenPQ-Verify/1.0"})
              with urllib.request.urlopen(req,timeout=20) as r:return json.loads(r.read().decode())
          aid=(get("https://api.cloudflare.com/client/v4/accounts").get("result") or [])[0]["id"]
          rows=get(f"https://api.cloudflare.com/client/v4/accounts/{aid}/pages/projects/jotrip-home/deployments").get("result") or []
          prod=[x for x in rows if x.get("environment")=="production"]
          for x in prod[:3]:
              m=((x.get("deployment_trigger") or {}).get("metadata") or {})
              print("prod",x.get("latest_stage",{}).get("status"),m.get("commit_hash"),x.get("created_on"),x.get("url"))
          PY
          ok=0
          for i in {1..20}; do
            curl -fsS "https://cms.openphuquoc.com/admin/admin.js?v=15&t=$i" -o admin.js || true
            if grep -q "function a2Summary" admin.js; then ok=1; break; fi
            sleep 3
          done
          echo "analytics_v2_asset=$ok"
          test "$ok" = "1"
          code="$(curl -sS -o analytics.json -w '%{http_code}' "https://cms.openphuquoc.com/api/cms/analytics")"
          echo "analytics_http=$code"
          test "$code" = "401"
