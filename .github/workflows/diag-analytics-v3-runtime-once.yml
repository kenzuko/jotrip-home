name: Diagnostic - Analytics V3 Runtime Once

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runtime render test
        run: |
          set -euo pipefail
          npm install jsdom@25 --no-save >/dev/null 2>&1
          node <<'NODE'
          const fs=require('fs');
          const {JSDOM}=require('jsdom');
          const dom=new JSDOM('<!doctype html><html><body><form id="editor"></form></body></html>',{url:'https://cms.openphuquoc.com/admin/'});
          global.window=dom.window;
          global.document=dom.window.document;
          global.URLSearchParams=dom.window.URLSearchParams;
          global.Intl=Intl;

          const data={
            generated_at:'2026-09-22T13:40:00+07:00',
            period:{from:'2026-09-16',to:'2026-09-22',days:7},
            storage:{d1:true},
            comparison:{cur_sea_in:42,prev_sea_in:35,cur_air_in:180,prev_air_in:170},
            trends:[
              {day:'2026-09-16',sea_in:5,sea_out:4,air_in:24,air_out:23},
              {day:'2026-09-17',sea_in:6,sea_out:5,air_in:25,air_out:24},
              {day:'2026-09-18',sea_in:7,sea_out:6,air_in:26,air_out:25},
              {day:'2026-09-19',sea_in:5,sea_out:6,air_in:27,air_out:27},
              {day:'2026-09-20',sea_in:6,sea_out:5,air_in:25,air_out:24},
              {day:'2026-09-21',sea_in:7,sea_out:7,air_in:28,air_out:27},
              {day:'2026-09-22',sea_in:6,sea_out:6,air_in:25,air_out:25}
            ],
            sea:{
              route_loads:[{operator:'Superdong',origin:'Hà Tiên',destination:'Phú Quốc',trips:7,load_trips:7,load_factor:78}],
              operator_loads:[{operator:'Superdong',trips:7,load_trips:7,load_factor:78}],
              route_volume:[{operator:'Superdong',origin:'Hà Tiên',destination:'Phú Quốc',trips:7}],
              load_trends:[
                {day:'2026-09-16',load_factor:60,trips:4,load_trips:4},
                {day:'2026-09-17',load_factor:65,trips:4,load_trips:4},
                {day:'2026-09-18',load_factor:70,trips:4,load_trips:4},
                {day:'2026-09-19',load_factor:72,trips:4,load_trips:4},
                {day:'2026-09-20',load_factor:75,trips:4,load_trips:4},
                {day:'2026-09-21',load_factor:77,trips:4,load_trips:4},
                {day:'2026-09-22',load_factor:78,trips:4,load_trips:4}
              ],
              trip_loads:[{service_date:'2026-09-22',operator:'Superdong',origin:'Hà Tiên',destination:'Phú Quốc',departure_time:'2026-09-22T10:00:00+07:00',vessel:'Superdong I',load_factor:78,evidence_class:'observed'}]
            },
            aviation:{
              airlines:[{airline:'Vietnam Airlines',flights:60,arrivals:30,departures:30}],
              stations:[{station:'TP.HCM',flights:80,arrivals:40,departures:40}],
              status_summary:{flights:180,delayed:12,cancelled:1,avg_delay_minutes:19},
              rows:[]
            },
            sync:[],
            evidence_note:'test'
          };

          const code=fs.readFileSync('admin/analytics-v3.js','utf8');
          dom.window.eval(code);
          if(!dom.window.OPQAnalyticsV3) throw new Error('OPQAnalyticsV3 missing');

          dom.window.OPQAnalyticsV3.mount({
            getData:()=>data,
            setData:()=>{},
            api:async()=>data,
            endpoint:'/api/cms/analytics',
            status:()=>{},
            helpers:{
              renderAviationTable:()=>'<div id="air-table">air</div>',
              renderSync:()=>'<div id="sync">sync</div>',
              fmtDateTime:v=>v
            }
          });

          const editor=document.querySelector('#editor');
          if(!editor.querySelector('svg')) throw new Error('overview SVG chart missing');
          if(editor.querySelectorAll('path').length<2) throw new Error('overview chart paths missing');
          if(!editor.querySelector('[data-a3period="last7"].active')) throw new Error('period active state missing');

          const select=editor.querySelector('#a3View');
          select.value='sea';
          select.dispatchEvent(new dom.window.Event('change',{bubbles:true}));
          if(!editor.textContent.includes('% phủ theo tuyến')) throw new Error('sea view did not render');
          if(!editor.querySelector('svg')) throw new Error('sea load trend SVG missing');

          const todayBtn=editor.querySelector('[data-a3period="today"]');
          todayBtn.click();
          await new Promise(r=>setTimeout(r,30));
          if(!editor.querySelector('[data-a3period="today"].active')) throw new Error('today active state missing after click');

          console.log('runtime_chart=PASS');
          console.log('svg_count='+editor.querySelectorAll('svg').length);
          console.log('path_count='+editor.querySelectorAll('path').length);
          console.log('period_click=PASS');
          console.log('view_change=PASS');
          NODE
