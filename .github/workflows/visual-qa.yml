name: OpenPQ Visual QA

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Routes to capture
        required: true
        default: full
        type: choice
        options:
          - full
          - smoke
          - home
  pull_request:
    paths:
      - ".github/workflows/visual-qa.yml"
      - "home-foundation-v2.js"
      - "home-experience-v1.js"
      - "home-library.js"
      - "stories/**"
      - "guide/**"
      - "data/content.json"
      - "data/home-support.json"
      - "data/knowledge/objects.json"
      - "scripts/test-article-card-links.mjs"
      - "scripts/visual-qa-article-cards.mjs"
      - "index.html"
      - "styles.css"
      - "app.js"
      - "core/hero-context.js"
      - "core/location-context.js"
      - "core/search-engine.js"
      - "home-nearme-v2.js"
      - "go/**"
      - "nearme/**"
      - "core/place-feedback.js"
      - "core/place-feedback.css"
      - "admin/feedback.js"
      - "admin/feedback.html"
      - "scripts/visual-qa-place-feedback.mjs"
      - "data/entities/nearme-essential-*.json"
      - "data/views/location-index.json"
      - "data/views/map-coverage.json"
      - "scripts/check-derived-views-sync.mjs"
      - "scripts/test-derived-views-sync.mjs"
      - "data/open/**"
      - "scripts/build-cloudflare.mjs"
      - "scripts/test-nearme-intake.mjs"
      - "explore/**"
      - "scripts/test-shared-area-and-schedules.mjs"
      - "scripts/visual-qa-shared-area.mjs"
      - "core/hero-gallery.js"
      - "core/decision-signals.js"
      - "core/go-engine.js"
      - "go/**"
      - "home-live-v3.js"
      - "core/decision-signals.js"
      - "core/go-engine.js"
      - "go/**"
      - "data/go-config.json"
      - "scripts/test-decision-signals.mjs"
      - "data/go-config.json"
      - "scripts/test-decision-signals.mjs"
      - "assets/hero/**"
      - "scripts/test-home-hero-gallery.mjs"
      - "scripts/test-home-hero-search.mjs"
      - "scripts/visual-qa-home-search.mjs"
      - "scripts/visual-qa.mjs"
      - "scripts/test-cancelled-show-trip-clock.mjs"
      - "data/operational-notices.json"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/visual-qa.yml"
      - "scripts/visual-qa.mjs"
      - "scripts/test-cancelled-show-trip-clock.mjs"
      - "data/operational-notices.json"
      - "scripts/build-cloudflare.mjs"
      - "index.html"
      - "styles.css"
      - "home-foundation-v2.js"
      - "home-experience-v1.js"
      - "home-library.js"
      - "home-library.css"
      - "stories/**"
      - "guide/**"
      - "data/content.json"
      - "data/home-support.json"
      - "data/knowledge/objects.json"
      - "scripts/test-article-card-links.mjs"
      - "scripts/visual-qa-article-cards.mjs"
      - "home-live-v3.js"
      - "app.js"
      - "core/hero-context.js"
      - "home-data-pulse.js"
      - "data/home-support.json"
      - "data/entities/utilities.json"
      - "data/entities/hotels.json"
      - "data/views/location-index.json"
      - "data/views/map-coverage.json"
      - "scripts/check-derived-views-sync.mjs"
      - "nearme/**"
      - "data/entities/places.json"
      - "data/entities/activities.json"
      - "currency/**"
      - "data/currency-snapshot.json"
      - "data/currency-history.json"
      - "transit/**"
      - "airport/**"

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the branch being tested
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check dated cancellation before browser QA
        run: node scripts/test-cancelled-show-trip-clock.mjs

      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.63.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production-like Cloudflare bundle
        run: |
          node scripts/build-knowledge-public.mjs
          node scripts/build-search-index.mjs
          node scripts/build-cloudflare.mjs
          test -f dist/data/views/knowledge-public.json
          test ! -e dist/data/knowledge/objects.json
          test -f dist/guide/knowledge.html
          test -f dist/guide/article.html
          test -f dist/home-foundation-v2.js
          test -f dist/currency/index.html
          test -f dist/transit/index.html

      - name: Start local site with explicit VI QA preference
        working-directory: dist
        run: |
          python3 - <<'PY' > /tmp/openpq-visual-server.log 2>&1 &
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler

          class Handler(SimpleHTTPRequestHandler):
              def end_headers(self):
                  self.send_header("Set-Cookie", "openpq_lang=vi; Path=/; SameSite=Lax")
                  super().end_headers()

          ThreadingHTTPServer(("127.0.0.1", 4173), Handler).serve_forever()
          PY
          echo $! > /tmp/openpq-visual-server.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/openpq-visual-server.log
          exit 1

      - name: Click every article-card surface and verify its destination
        env:
          VISUAL_QA_BASE_URL: http://127.0.0.1:4173
        run: node scripts/visual-qa-article-cards.mjs

      - name: Verify homepage contextual hero and keyboard-safe search
        run: |
          node scripts/test-home-hero-search.mjs
          node scripts/test-home-hero-gallery.mjs
          node scripts/visual-qa-home-search.mjs

      - name: Exercise session area handoff across homepage, GO, Near Me and Explore
        run: node scripts/visual-qa-shared-area.mjs

      - name: Check Near Me MacBook layout, mobile map and homepage handoff
        run: node scripts/visual-qa-nearme-layout.mjs

      - name: Test public feedback and private CMS review on mobile
        run: node scripts/visual-qa-place-feedback.mjs

      - name: Run visual QA
        env:
          VISUAL_QA_BASE_URL: http://127.0.0.1:4173
          VISUAL_QA_SCOPE: ${{ inputs.scope || 'smoke' }}
        run: VISUAL_QA_SCOPE="$VISUAL_QA_SCOPE" node scripts/visual-qa.mjs

      - name: Preserve server log
        if: always()
        run: cp /tmp/openpq-visual-server.log visual-qa-results/server.log 2>/dev/null || true

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openpq-visual-qa-${{ github.run_number }}
          path: visual-qa-results/
          retention-days: 7
          if-no-files-found: error
