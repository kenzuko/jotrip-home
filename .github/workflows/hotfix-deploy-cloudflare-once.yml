name: Hotfix - Deploy CMS to Cloudflare Once

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Cloudflare account
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(python - <<'PY'
          import json, os, urllib.request
          token=os.environ["CF_API_TOKEN"].strip()
          req=urllib.request.Request("https://api.cloudflare.com/client/v4/accounts",headers={
            "Authorization":"Bearer "+token,
            "Content-Type":"application/json",
            "User-Agent":"OpenPQ-Hotfix/1.0",
          })
          with urllib.request.urlopen(req,timeout=20) as r:
            doc=json.loads(r.read().decode())
          rows=doc.get("result") or []
          if not rows:
            raise SystemExit("No Cloudflare account visible to token")
          print(rows[0]["id"])
          PY
          )"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
      - name: Build Cloudflare Pages output
        run: |
          node scripts/build-cloudflare.mjs
          node --check admin/admin.js
          node --check functions/api/cms/analytics.js
          grep -q 'const \$\$=s=>Array.from(document.querySelectorAll(s));' dist/admin/admin.js
      - name: Deploy current main to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4 pages deploy dist --project-name jotrip-home --branch main --commit-dirty=true
