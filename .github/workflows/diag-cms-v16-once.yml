name: Diagnostic - Confirm CMS v16 Once

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Cloudflare Pages and live asset
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          token=os.environ["CF_API_TOKEN"].strip()
          def get(url):
              req=urllib.request.Request(url,headers={"Authorization":"Bearer "+token,"Content-Type":"application/json","User-Agent":"OpenPQ-CMS-Diag/1.0"})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.loads(r.read().decode())
          accounts=get("https://api.cloudflare.com/client/v4/accounts").get("result") or []
          aid=accounts[0]["id"]
          rows=get(f"https://api.cloudflare.com/client/v4/accounts/{aid}/pages/projects/jotrip-home/deployments").get("result") or []
          prod=[x for x in rows if x.get("environment")=="production"]
          for x in prod[:5]:
              m=((x.get("deployment_trigger") or {}).get("metadata") or {})
              print("prod",x.get("latest_stage",{}).get("status"),m.get("commit_hash"),x.get("created_on"),x.get("url"))
          PY
          ok=0
          for i in {1..45}; do
            curl -fsS "https://cms.openphuquoc.com/admin/admin.js?v=16&t=$i" -o admin.js || true
            if grep -q 'const \$\$=s=>Array.from(document.querySelectorAll(s));' admin.js; then
              ok=1
              break
            fi
            sleep 4
          done
          echo "helper_present=$ok"
          test "$ok" = "1"
