name: Near Me Geoapify GPS research

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max new addresses for this run (1-200)'
        required: false
        default: '50'
      budget:
        description: 'Max Geoapify API requests for this run (1-1000)'
        required: false
        default: '150'
  schedule:
    - cron: '15 19 * * *' # 02:15 Asia/Ho_Chi_Minh, after merge to main

permissions:
  contents: read

concurrency:
  group: nearme-geoapify-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests (offline; no API usage)
        run: node scripts/test-geocode-geoapify.mjs
      - name: Restore request cache
        uses: actions/cache@v4
        with:
          path: .cache/near-go/geoapify-cache.json
          key: nearme-geoapify-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nearme-geoapify-v1-
      - name: Geocode unlocated essential businesses (research only)
        env:
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
          REQUEST_LIMIT: ${{ github.event.inputs.limit || '50' }}
          REQUEST_BUDGET: ${{ github.event.inputs.budget || '150' }}
        run: |
          if [ -z "$GEOAPIFY_API_KEY" ]; then
            echo 'GEOAPIFY_API_KEY secret is not set; no external requests were made.'
            exit 1
          fi
          node scripts/geocode-geoapify.mjs "--limit=$REQUEST_LIMIT" "--budget=$REQUEST_BUDGET"
      - name: Upload GPS candidates for human review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nearme-geoapify-candidates
          path: .cache/near-go/geoapify-candidates.json
          retention-days: 30
          if-no-files-found: error
