name: Diagnostic - Analytics V2 QA

on:
  push:
    branches:
      - "feat/analytics-v2-range-load-charts"

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Analytics JavaScript syntax
        run: |
          node --check functions/api/cms/analytics.js
          node --check admin/admin.js
      - name: Build Cloudflare CMS bundle
        run: |
          node scripts/build-cloudflare.mjs
          test -f dist/admin/admin.js
          test -f dist/functions/api/cms/analytics.js || true
      - name: Assert Analytics V2 contract
        run: |
          grep -q "sea_load_observations" functions/api/cms/analytics.js
          grep -q "route_loads" functions/api/cms/analytics.js
          grep -q "data-a2range" admin/admin.js
          grep -q "% phủ theo tuyến" admin/admin.js
