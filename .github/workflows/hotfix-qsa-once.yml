name: Hotfix - Deploy Analytics qsa Once

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Cloudflare account
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(python - <<'PY'
          import json, os, urllib.request
          token=os.environ["CF_API_TOKEN"].strip()
          req=urllib.request.Request("https://api.cloudflare.com/client/v4/accounts",headers={
            "Authorization":"Bearer "+token,
            "Content-Type":"application/json",
            "User-Agent":"OpenPQ-Hotfix/1.0",
          })
          with urllib.request.urlopen(req,timeout=20) as r:
            doc=json.loads(r.read().decode())
          rows=doc.get("result") or []
          if not rows:
            raise SystemExit("No Cloudflare account")
          print(rows[0]["id"])
          PY
          )"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
      - name: Build and validate CMS
        run: |
          set -euo pipefail
          node --check admin/admin.js
          node --check functions/api/cms/analytics.js
          ! grep -q '\$qsa(' admin/admin.js
          grep -q 'const qsa=s=>Array.from(document.querySelectorAll(s));' admin/admin.js
          grep -q 'qsa("#editor \[data-a2range\]")' admin/admin.js
          node scripts/build-cloudflare.mjs
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4 pages deploy dist --project-name jotrip-home --branch main --commit-dirty=true
      - name: Verify custom CMS domain
        run: |
          set -euo pipefail
          ok=0
          for i in {1..25}; do
            curl -fsS "https://cms.openphuquoc.com/admin/admin.js?v=17&t=$i" -o live-admin.js || true
            if grep -q 'const qsa=s=>Array.from(document.querySelectorAll(s));' live-admin.js && ! grep -q '\$qsa(' live-admin.js; then
              ok=1
              break
            fi
            sleep 3
          done
          echo "qsa_fix_live=$ok"
          test "$ok" = "1"
          code="$(curl -sS -o analytics.json -w '%{http_code}' "https://cms.openphuquoc.com/api/cms/analytics")"
          echo "analytics_unauth_http=$code"
          test "$code" = "401"
